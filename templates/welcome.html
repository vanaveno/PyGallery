{% extends "base.html" %}

{% block title %}Úvod - ZeroVideo{% endblock %}

{% block content %}
<div class="text-center py-10">
    <h1 class="text-3xl font-bold mb-16">Vítejte v ZeroVideo Gallery</h1>
    <div class="lg:flex lg:space-x-8  justify-center">
        <!-- Galerie karta -->
        <div class="w-80 media-card rounded-xl p-8 cursor-pointer" onclick="window.location.href='/gallery/pics'">
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-photo-film lg:text-8xl text-4xl text-blue-400 mb-4"></i>
                <span class="lg:text-2xl text-xl font-bold mb-2">Galerie</span>
               
            </div>
        </div>

        <!-- Video karta -->
        <div class="w-80 media-card rounded-xl p-8 cursor-pointer" onclick="window.location.href='/gallery/videos'">
            <div class="flex flex-col items-center">
                <i class="fa-solid fa-film lg:text-8xl text-4xl  text-green-400 mb-4"></i>
                <span class="lg:text-2xl text-xl  font-bold mb-2">Video</span>
               
            </div>
        </div>
    </div>
</div>
{% endblock %}
