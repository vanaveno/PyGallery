<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZeroVideo Gallery{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .media-card {
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #374151, #4B5563);
            border: 1px solid #4B5563;
        }
        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border-color: #60A5FA;
        }

         /* Reset pro modální okna */
    .modal-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
    }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
    <!-- Hlavička -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="http://192.168.1.171/" class="text-2xl font-bold text-blue-400 hover:text-blue-300 transition-colors">
                    <i class="fas fa-play-circle mr-2"></i>ZeroVideo
                </a>
                <nav class="flex space-x-6">
                    <a href="/gallery/pics" class="text-gray-300 hover:text-white transition-colors font-medium {% if request.url.path == '/gallery/pics' %}text-white border-b-2 border-blue-500{% endif %}">
                        <i class="fas fa-photo-film mr-2"></i>Galerie
                    </a>
                    <a href="/gallery/videos" class="text-gray-300 hover:text-white transition-colors font-medium {% if request.url.path == '/gallery/videos' %}text-white border-b-2 border-green-500{% endif %}">
                        <i class="fas fa-film mr-2"></i>Video
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Patička -->
    <footer class="bg-gray-800 border-t border-gray-700 py-6">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400">
                &copy; 2024 ZeroVideo Gallery. Všechna práva vyhrazena.
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
